name: Build macOS .dmg

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-14
    steps:
      - name: Checkout RackAB
        uses: actions/checkout@v4

      - name: Checkout JUCE 9.x
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.0
          path: JUCE

      - name: Build .dmg
        run: |
          chmod +x installer/mac/build_dmg.sh
          ./installer/mac/build_dmg.sh "$GITHUB_WORKSPACE/JUCE"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: RackAB-macOS-dmg
          path: installer/mac/output/*.dmg
          if-no-files-found: error
