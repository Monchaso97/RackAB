name: Build macOS .dmg

# Builds the macOS RackAB.vst3 and packages it into a .dmg on GitHub's
# cloud Mac (Xcode + CMake come preinstalled). You do NOT need to install
# anything on your own Mac or PC — push, then download the .dmg artifact.
#
# Runs on every push, and on demand from the Actions tab ("Run workflow").

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dmg:
    runs-on: macos-14        # Apple-silicon runner; builds a universal binary
    steps:
      - name: Checkout RackAB
        uses: actions/checkout@v4

      - name: Checkout JUCE 9.x
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.0          # pin the version this plugin was built against
          path: JUCE

      - name: Build .dmg
        run: |
          chmod +x installer/mac/build_dmg.sh
          ./installer/mac/build_dmg.sh "$GITHUB_WORKSPACE/JUCE"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: RackAB-macOS-dmg
          path: installer/mac/output/*.dmg
          if-no-files-found: error
